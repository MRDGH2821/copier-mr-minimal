---
# Optional signed Nix store cache (GitLab CI cache of .nix-cache).
# If .gitlab/nix-cache.pub / NIX_CACHE_PRIVATE_KEY are missing, flake check
# still runs; only signed cache import/export is skipped.
# Setup: see docs/setup/nix-ci-cache.md
.nix-cache: &nix-cache
  key:
    files:
      - flake.lock
    prefix: nix-cache-${CI_RUNNER_EXECUTABLE_ARCH}
  paths:
    - .nix-cache
  when: always
.nix-flake-check:
  after_script:
    - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
    - |
      if [ -z "${NIX_CACHE_PRIVATE_KEY:-}" ]; then
        echo "NIX_CACHE_PRIVATE_KEY unset; skipping cache export."
      elif [ ! -f "${NIX_CACHE_PUBKEY_FILE}" ] || [ ! -s "${NIX_CACHE_PUBKEY_FILE}" ]; then
        echo "${NIX_CACHE_PUBKEY_FILE} missing or empty; skipping signed cache export."
        echo "See docs/setup/nix-ci-cache.md"
      else
        # File-type CI variables expand to a path; env_var type is raw key material.
        if [ -f "${NIX_CACHE_PRIVATE_KEY}" ]; then
          key_file="${NIX_CACHE_PRIVATE_KEY}"
        else
          key_file="${CI_PROJECT_DIR}/.nix-cache-signing.key"
          umask 077
          printf '%s\n' "${NIX_CACHE_PRIVATE_KEY}" > "${key_file}"
        fi
        mkdir -p "${NIX_CACHE_DIR}"
        echo "Exporting signed store paths to local CI cache..."
        nix copy --all --to "file://${NIX_CACHE_DIR}?compression=zstd&parallel-compression=true&secret-key=${key_file}"
        if [ "${key_file}" = "${CI_PROJECT_DIR}/.nix-cache-signing.key" ]; then
          rm -f "${key_file}"
        fi
      fi
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates xz-utils git
    - curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install linux --no-confirm --init none
    - . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
    - |
      export NIX_CONFIG="accept-flake-config = true"
      export NIX_CI_CACHE_TRUSTED=0
      if [ -f "${NIX_CACHE_PUBKEY_FILE}" ] && [ -s "${NIX_CACHE_PUBKEY_FILE}" ]; then
        pubkey="$(tr -d '[:space:]' < "${NIX_CACHE_PUBKEY_FILE}")"
        if [ -n "${pubkey}" ]; then
          export NIX_CONFIG="${NIX_CONFIG}
      extra-trusted-public-keys = ${pubkey}"
          export NIX_CI_CACHE_TRUSTED=1
        fi
      fi
      if [ "${NIX_CI_CACHE_TRUSTED}" != "1" ]; then
        echo "No public key at ${NIX_CACHE_PUBKEY_FILE}; running without signed CI cache."
        echo "See docs/setup/nix-ci-cache.md to enable caching."
      fi
    - mkdir -p "${NIX_CACHE_DIR}"
    - |
      if [ "${NIX_CI_CACHE_TRUSTED:-0}" = "1" ] && [ -f "${NIX_CACHE_DIR}/nix-cache-info" ]; then
        echo "Importing signed store paths from local CI cache..."
        if ! nix copy --all --from "file://${NIX_CACHE_DIR}"; then
          echo "Cache import failed (legacy unsigned or corrupt); discarding and cold-starting."
          find "${NIX_CACHE_DIR}" -mindepth 1 -delete
        fi
      elif [ "${NIX_CI_CACHE_TRUSTED:-0}" != "1" ]; then
        echo "Skipping local CI cache import (signing not configured)."
      else
        echo "No local CI cache (cold start)"
      fi
  image: debian:stable-slim
  # before_script and script share one shell; NIX_CONFIG / PATH are already set.
  script:
    - nix flake check
  variables:
    NIX_CACHE_DIR: ${CI_PROJECT_DIR}/.nix-cache
    NIX_CACHE_PUBKEY_FILE: ${CI_PROJECT_DIR}/.gitlab/nix-cache.pub
# MRs / feature branches: restore only; cannot write cache.
nix-flake-check:
  cache:
    !!merge <<: *nix-cache
    policy: pull
  extends: .nix-flake-check
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: never
    - when: on_success
# default branch / protected tags: can pull-push a signed cache when keys exist.
nix-flake-check:protected:
  cache:
    !!merge <<: *nix-cache
    policy: pull-push
  extends: .nix-flake-check
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
